# Configuración de build para Netlify — sitio estático Vite.
# Versionado en el repo: la config vive en código, no escondida en el panel web.

[build]
  command = "npm run build"   # Vite compila el sitio
  publish = "dist"            # carpeta que Netlify sirve como sitio estático

[build.environment]
  NODE_VERSION = "20"         # fija Node para builds reproducibles (evita "en mi máquina jala")

# SPA fallback NO se incluye a propósito: esto es una landing de una sola página
# con navegación por anclas (#hero, #artista, ...). No hay enrutado de cliente,
# así que un redirect /* → /index.html sería ruido innecesario.
